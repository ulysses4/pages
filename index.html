<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igor's pages</title>
<style>
  body{margin:0;background:#fafaf9;font:16px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1f2a37}
  main{max-width:640px;margin:0 auto;padding:48px 20px}
  h1{font-size:26px;margin:0 0 6px} .sub{color:#6b7280;margin:0 0 28px}
  ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
  a.card{display:block;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px 20px;text-decoration:none;color:inherit;transition:box-shadow .15s}
  a.card:hover{box-shadow:0 4px 18px rgba(0,0,0,.07)}
  a.card b{font-size:17px} a.card span{display:block;color:#6b7280;font-size:14px;margin-top:2px}
  .lock{float:right;color:#9ca3af;font-size:13px;margin-top:3px}
</style>
</head>
<body>
<main>
  <h1>Igor's pages</h1>
  <p class="sub">Each page asks for its password.</p>
  <ul id="sites">
    <li><a class="card" href="london/"><span class="lock">🔒</span><b>London with Dad</b><span>14–18 November 2026 · map, routes and day-by-day plan</span></a></li>
  </ul>
</main>
</body>
</html>
