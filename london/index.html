<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ink:#1f2a37; --muted:#6b7280; --line:#e5e7eb; --accent:#b91c1c; --booked:#15803d; --todo:#b45309; --bg:#fafaf9; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:14px 20px 10px; }
  a.home { display:inline-block; color:var(--muted); text-decoration:none; font-size:14px; margin-bottom:6px; padding:6px 10px 6px 0; }
  a.home:hover { color:var(--ink); }
  header h1 { margin:0; font-size:22px; letter-spacing:.2px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  .tabs { display:flex; gap:6px; padding:0 20px 12px; overflow-x:auto; }
  .tab { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; cursor:pointer; white-space:nowrap; font-size:14px; }
  .tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  #map { height:52vh; min-height:360px; margin:0 20px; border-radius:12px; border:1px solid var(--line); }
  .legend { display:flex; gap:18px; padding:8px 20px 0; color:var(--muted); font-size:13px; flex-wrap:wrap; }
  .legend span::before { content:""; display:inline-block; width:28px; height:0; border-top:4px solid var(--c, var(--accent)); border-radius:2px; vertical-align:middle; margin-right:6px; }
  .legend span.dot::before { border-top-style:dotted; border-top-width:3px; }
  .legend .b { color:var(--booked); font-weight:600; } .legend .b::before { display:none; }
  .legend .t { color:var(--todo); font-weight:600; } .legend .t::before { display:none; }
  .legend .tap { color:var(--muted); } .legend .tap::before { display:none; }
  section.day { display:none; padding:14px 20px 40px; }
  section.day.active { display:block; }
  section.day h2 { margin:6px 0 2px; font-size:19px; }
  section.day .sub { color:var(--muted); margin:0 0 12px; font-size:14px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-top:1px solid var(--line); vertical-align:top; }
  th { background:#f3f4f6; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); border-top:0; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#fef2f2; }
  tbody tr.sel { background:#fee2e2; }
  td.n { width:34px; text-align:center; }
  td.n b { display:inline-block; width:24px; height:24px; line-height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; }
  td.time { white-space:nowrap; width:92px; color:var(--muted); }
  .booked { color:var(--booked); font-weight:600; white-space:nowrap; }
  .todo { color:var(--todo); font-weight:600; white-space:nowrap; }
  .free { color:var(--muted); white-space:nowrap; }
  .notes { margin-top:14px; font-size:14px; color:var(--muted); }
  .marker { background:var(--accent); color:#fff; border-radius:50%; width:26px; height:26px; line-height:26px; text-align:center; font-weight:700; font-size:12px; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); cursor:pointer; }
  /* detail card */
  #detail { display:none; margin:12px 20px 0; background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:12px; padding:14px 16px; }
  #detail.open { display:block; }
  #detail .dt { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  #detail h3 { margin:0; font-size:17px; }
  #detail .when { color:var(--muted); font-size:13px; margin:2px 0 8px; }
  #detail a.site { display:inline-block; font-weight:600; color:var(--accent); text-decoration:none; border:1px solid #fecaca; background:#fff5f5; border-radius:8px; padding:6px 10px; margin-bottom:10px; }
  #detail a.site::after { content:" ↗"; }
  #detail p { margin:0; }
  #detail button { border:0; background:transparent; font-size:20px; line-height:1; cursor:pointer; color:var(--muted); }
  @media (max-width:600px){ header,.tabs,section.day,.legend{padding-left:12px;padding-right:12px} #map,#detail{margin-left:12px;margin-right:12px} th:nth-child(4),td:nth-child(4){display:none} }
</style>
</head>

  <h1>London · 14–18 November 2026</h1>
  <p>Days 1–2 together; days 3–4 solo (budget £250/day); leave Wednesday 18th. Routes are traced stop to stop — dotted is on foot; solid lines are coloured by Tube line, bus, boat or cab. Tap any stop for details.</p>

    {t:'+15 min', name:'London Paddington', what:'Heathrow Express terminates here. Tap out, then black cab from the rank to the hotel', ll:[51.5154,-0.1755], status:'no', via:'hex', link:'ride', url:'https://tfl.gov.uk/modes/elizabeth-line/',

 { id:'sat', tab:'Sat 14', title:'Saturday 14 — The City & the river', sub:'Lord Mayor\'s Show, City pub lunch, the river at dusk.',

    {t:'9:30', name:'The Wolseley', what:'Breakfast, Piccadilly', ll:[51.5076,-0.1407], status:'optional', url:'https://www.thewolseley.com',
     desc:'A grand café in the Viennese style inside a 1921 Bentley car showroom on Piccadilly, next to the Ritz. The full English and the pastries are the classic London power breakfast; the room — black marble, chandeliers, domed ceiling — is the point.'},
    {t:'10:30', name:'St Paul\'s Cathedral steps', what:'Lord Mayor\'s Show — procession leaves Mansion House 11:00, ~1 hr to pass', ll:[51.5138,-0.0984], status:'free', via:'central', link:'ride', url:'https://lordmayorsshow.london',
     desc:'The Lord Mayor\'s Show has run for over 800 years: the new Lord Mayor of the City rides in a gilded 1757 state coach, escorted by military bands, livery companies, 250 horses and 50-odd floats. The steps of St Paul\'s give the best view as the coach pauses for the Dean\'s blessing. This year the river pageant returns too.'},
    {t:'12:30', name:'Bank of England Museum', what:'Rare Saturday opening, 11–4', ll:[51.5142,-0.0877], status:'free', link:'walk', url:'https://www.bankofengland.co.uk/museum',
     desc:'Inside the "Old Lady of Threadneedle Street", the central bank founded in 1694. See a real 13 kg gold bar you can lift, the history of the banknote, and the vaults story. Normally weekdays only — the Lord Mayor\'s Show is one of its few Saturday openings.'},
    {t:'1:30', name:'Ye Olde Cheshire Cheese', what:'Pint and pie, Fleet Street; then the lanes down to the river', ll:[51.5143,-0.1073], status:'no', link:'walk', url:'https://en.wikipedia.org/wiki/Ye_Olde_Cheshire_Cheese',
     desc:'A warren of dark-panelled rooms and cellars rebuilt in 1667 just after the Great Fire. Dickens, Dr Johnson, Mark Twain and Conan Doyle all drank here. Sawdust floors, coal fires, steak and kidney pudding — the archetypal old London pub.'},
    {t:'3:00', name:'Millennium Bridge', what:'Cross to the South Bank — St Paul\'s behind, Tate Modern ahead', ll:[51.5097,-0.0986], status:'free', link:'walk', url:'https://en.wikipedia.org/wiki/Millennium_Bridge,_London',

    {t:'3:15', name:'Tate Modern', what:'Turbine Hall and the free 10th-floor terrace, 20 min', ll:[51.5076,-0.0994], status:'free', link:'walk', url:'https://www.tate.org.uk/visit/tate-modern',
     desc:'Britain\'s modern art museum in the former Bankside power station. The cathedral-sized Turbine Hall holds one giant commission at a time, and the free viewing level on the Blavatnik Building gives a 360° view over the river and the City.'},
    {t:'3:45', name:'Shakespeare\'s Globe → Southwark Cathedral', what:'Thames path east past the Golden Hinde and Borough Market', ll:[51.5063,-0.0900], status:'free', link:'walk', url:'https://www.shakespearesglobe.com',
     desc:'The Globe is a faithful 1997 reconstruction of Shakespeare\'s 1599 playhouse, thatched roof and all, a few hundred yards from the original site. Further on: the Golden Hinde replica of Drake\'s ship and Southwark Cathedral, London\'s oldest Gothic church, where Shakespeare\'s brother is buried.'},
    {t:'4:15', name:'Tower Bridge / HMS Belfast', what:'Lord Mayor\'s flotilla through the bridge; Tower lit up opposite (check time on lordmayorsshow.london)', ll:[51.5055,-0.0754], status:'free', link:'walk', url:'https://www.towerbridge.org.uk',
     desc:'The Victorian bascule bridge of 1894, the one everyone pictures when they think of London. Its two halves still lift for tall ships. HMS Belfast, the WWII cruiser moored alongside, fired some of the first shots on D-Day. Watch the Lord Mayor\'s barge pass through, with the Tower of London floodlit on the far bank.'},
    {t:'7:30', name:'Wiltons', what:'Dinner, Jermyn Street — game, oysters, Dover sole', ll:[51.5078,-0.1375], status:'booked', via:'cab', link:'ride', url:'https://www.wiltons.co.uk',
     desc:'Founded 1742 as an oyster stall; on Jermyn Street since 1984, with white-jacketed waiters and a Royal Warrant. The things to order are what London has eaten for two centuries: native oysters, potted shrimps, grouse or partridge in season, Dover sole off the bone.'},
   ],
   notes:'Shortcut if legs tire: from Tate Modern take the Uber Boat from Bankside Pier two stops to Tower Pier, or sit at The Anchor, Bankside (river tables).'},
 { id:'sun', tab:'Sun 15', title:'Sunday 15 — Royal London', sub:'Flower market, the Tower, Sunday roast, Churchill\'s bunker, the lights.',

    {t:'12:45', name:'Tower Hill station', what:'Walk to Tower Hill; District line to Embankment, Bakerloo to Piccadilly Circus, ~20 min', ll:[51.5098,-0.0766], status:'no', link:'walk', url:'https://tfl.gov.uk',

     desc:'London\'s best-regarded steakhouse group, named after the baroque architect. The Sunday roast — rump of British beef, Yorkshire pudding, duck-fat potatoes, bone-marrow gravy — is the dish that made their name. Air Street is a grand 1920s dining room above Regent Street.'},
    {t:'3:30', name:'Churchill War Rooms', what:'90 minutes, King Charles Street', ll:[51.5021,-0.1292], status:'booked', link:'walk', url:'https://www.iwm.org.uk/visits/churchill-war-rooms',

    {t:'5:15', name:'Regent Street & Fortnum\'s', what:'Christmas lights, a browse', ll:[51.5110,-0.1385], status:'no', link:'walk', url:'https://www.fortnumandmason.com',
     desc:'Regent Street\'s Nash curve is lit with its "Spirit of Christmas" angels from early November. Fortnum & Mason on Piccadilly has been the grocer to the royal household since 1707 — teas, hampers, the clock with Mr Fortnum and Mr Mason bowing on the hour.'},
    {t:'7:30', name:'J Sheekey', what:'Easy fish supper, St Martin\'s Court', ll:[51.5111,-0.1278], status:'todo', link:'walk', url:'https://www.j-sheekey.co.uk',

   ],
   notes:'West End show moved to Monday or Wednesday night — Sunday is mostly matinees. Pick: Les Misérables, Witness for the Prosecution, The Mousetrap, or Phantom.'},
 { id:'mon', tab:'Mon 16', title:'Monday 16 — Westminster & Greenwich', sub:'Solo, ~£115. Abbey at opening, the Guard, then the river to Greenwich.',
   stops:[
    {t:'9:30', name:'Westminster Abbey', what:'Booked 9:30–10:30 entry; stay as long as you like. £31', ll:[51.4994,-0.1273], status:'booked', url:'https://www.westminster-abbey.org',
     desc:'The coronation church of every English monarch since 1066 and the burial place of seventeen of them, plus Newton, Darwin, Dickens and Chaucer in Poets\' Corner. The Coronation Chair, the Lady Chapel\'s fan vaulting and the Tomb of the Unknown Warrior are the must-sees. Take the audio guide.'},
    {t:'10:40', name:'Buckingham Palace', what:'Walk via Birdcage Walk; Changing of the Guard 11:00 (confirm on householddivision.org.uk)', ll:[51.5014,-0.1419], status:'free', link:'walk', url:'https://www.rct.uk/visit/buckingham-palace',
     desc:'The monarch\'s London residence since Queen Victoria in 1837. Changing the Guard: the King\'s Guard in bearskins and red tunics hands over to the new detachment, with a regimental band, in the forecourt. Stand by the Victoria Memorial for the band\'s approach down the Mall.'},
    {t:'11:45', name:'St James\'s Park → Horse Guards → Whitehall', what:'The lake bridge view, mounted sentries, Cenotaph, Downing Street gates, Big Ben', ll:[51.5045,-0.1273], status:'free', link:'walk', url:'https://www.householddivision.org.uk',

    {t:'1:30', name:'Westminster Pier', what:'Uber Boat (Thames Clippers) downriver, ~£10, 40 min', ll:[51.5017,-0.1237], status:'no', link:'walk', url:'https://www.thamesclippers.com',

     desc:'The last surviving tea clipper, built in 1869, once the fastest sailing ship afloat on the China run. She sits raised in a glass cradle so you can walk beneath her copper hull as well as on deck.'},
    {t:'3:15', name:'Royal Observatory', what:'Up the hill, meridian line, the view back to the City. £24', ll:[51.4769,-0.0005], status:'no', link:'walk', url:'https://www.rmg.co.uk/royal-observatory',

    {t:'4:30', name:'Greenwich Pier', what:'Boat back at dusk', ll:[51.4833,-0.0094], status:'no', link:'walk', url:'https://www.thamesclippers.com',

    {t:'7:30', name:'Rules (or The Guinea Grill)', what:'Dinner, Maiden Lane. West End show tonight if booked', ll:[51.5103,-0.1230], status:'todo', via:'boat', link:'ride', url:'https://rules.co.uk',

   ],
   notes:'Black cab from the pier to dinner is a fair treat, ~£20. If Rules is full, The Guinea Grill in Mayfair.'},
 { id:'tue', tab:'Tue 17', title:'Tuesday 17 — Bloomsbury & the City', sub:'Solo, ~£60. British Museum, St Paul\'s, sunset from the Sky Garden, a bus up top, a pub with the papers.',

     desc:'The world\'s first national public museum (1753) and one of its greatest: the Rosetta Stone, the Parthenon sculptures, the Egyptian mummies, the Sutton Hoo treasure. Foster\'s glass-roofed Great Court is a sight in itself. Free; don\'t try to see it all.'},
    {t:'12:30', name:'The Lamb', what:'Pub lunch, Lamb\'s Conduit Street', ll:[51.5222,-0.1186], status:'no', link:'walk', url:'https://en.wikipedia.org/wiki/The_Lamb,_Bloomsbury',
     desc:'A Victorian pub kept almost untouched, with its original etched-glass "snob screens" around the bar — once used so gentlemen couldn\'t be seen by the staff. A Dickens local. Good pie and a quiet pint on a pretty Bloomsbury street.'},
    {t:'2:00', name:'St Paul\'s Cathedral', what:'Tube Holborn → St Paul\'s. Dome climb if knees allow; last entry 4:00', ll:[51.5138,-0.0984], status:'booked', via:'central', link:'ride', url:'https://www.stpauls.co.uk',
     desc:'Wren\'s masterpiece, finished in 1710 after the Great Fire destroyed the medieval cathedral; the dome is one of the largest in the world. Climb to the Whispering Gallery (a murmur carries across the dome) and on to the Golden Gallery for the view. Nelson and Wellington are buried in the crypt; Churchill\'s funeral was held here.'},
    {t:'4:00', name:'Sky Garden', what:'Walk 12 min via Cheapside and Leadenhall. Sunset over the river. Free, timed ticket', ll:[51.5112,-0.0836], status:'todo', link:'walk', url:'https://skygarden.london',
     desc:'A free public garden on the 35th floor of the "Walkie-Talkie" tower, with a terrace facing south over the Thames, the Shard and Tower Bridge. Book a free timed slot online; bring ID. Sunset is about 4:10 pm in mid-November.'},
    {t:'5:15', name:'Monument bus stop', what:'Walk 5 min; board the 15 towards Trafalgar Square', ll:[51.5104,-0.0863], status:'no', link:'walk', url:'https://tfl.gov.uk/bus/route/15',

const map = L.map('map', {scrollWheelZoom:false});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; OpenStreetMap contributors', maxZoom:19 }).addTo(map);
let layer = L.layerGroup().addTo(map);
let markers = [];
let current = null;

function statusCell(s){
  if(s==='booked') return '<span class="booked">✓ booked</span>';
  if(s==='todo') return '<span class="todo">BOOK</span>';
  if(s==='free') return '<span class="free">free</span>';
  if(s==='no') return '<span class="free">—</span>';
  return '<span class="free">'+s+'</span>';
}

function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(_){ return u; } }

function showDetail(dayId, i){
  const day = DAYS.find(d=>d.id===dayId), s = day.stops[i];
  const el = document.getElementById('detail');
  el.innerHTML = '<div class="dt"><div><h3>'+(i+1)+'. '+s.name+'</h3><div class="when">'+s.t+' · '+s.what+'</div></div><button aria-label="Close" onclick="closeDetail()">×</button></div>'
    + (s.url ? '<a class="site" href="'+s.url+'" target="_blank" rel="noopener">'+host(s.url)+'</a>' : '')
    + '<p>'+s.desc+'</p>';
  el.classList.add('open');
  document.querySelectorAll('#day-'+dayId+' tbody tr').forEach((r,k)=>r.classList.toggle('sel', k===i));
  if(markers[i]) markers[i].openPopup();
}
function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.querySelectorAll('tbody tr.sel').forEach(r=>r.classList.remove('sel'));
  map.closePopup();
}

function show(id){
  current = id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.id===id));
  document.querySelectorAll('section.day').forEach(s=>s.classList.toggle('active', s.id==='day-'+id));
  closeDetail();
  const day = DAYS.find(d=>d.id===id);
  layer.clearLayers(); markers = [];
  const pts = []; const used = new Set();
  day.stops.forEach((s,i)=>{
    const icon = L.divIcon({className:'', html:'<div class="marker">'+(i+1)+'</div>', iconSize:[26,26], iconAnchor:[13,13]});
    const m = L.marker(s.ll,{icon}).bindPopup('<b>'+(i+1)+'. '+s.name+'</b><br>'+s.t+' — '+s.what).addTo(layer);
    m.on('click', ()=>showDetail(id, i));
    markers.push(m);
    if(i>0){
      const prev = day.stops[i-1].ll;
      const ride = s.link==='ride', mode = ride ? (MODES[s.via]||MODES.cab) : MODES.walk;
      L.polyline([prev, s.ll], {color:mode.color, weight: ride?5:4, opacity:.9, dashArray: ride ? null : '2 8', lineCap:'round'}).addTo(layer);
      if(ride) used.add(s.via||'cab');
    }
    pts.push(s.ll);
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.15));
  const lg = document.getElementById('legend');
  lg.innerHTML = '<span class="dot">Walk</span>' + [...used].map(k=>'<span style="--c:'+(MODES[k]||MODES.cab).color+'">'+(MODES[k]||MODES.cab).label+'</span>').join('')
    + '<span class="b">✓ booked</span><span class="t">BOOK</span><span class="tap">Tap a stop for details</span>';
  history.replaceState(null,'','#'+id);
}

const tabs = document.getElementById('tabs'), days = document.getElementById('days');
DAYS.forEach(d=>{
  const b = document.createElement('button'); b.className='tab'; b.textContent=d.tab; b.dataset.id=d.id; b.onclick=()=>show(d.id); tabs.appendChild(b);
  const rows = d.stops.map((s,i)=>'<tr data-i="'+i+'"><td class="n"><b>'+(i+1)+'</b></td><td class="time">'+s.t+'</td><td><b>'+s.name+'</b></td><td>'+s.what+'</td><td>'+statusCell(s.status)+'</td></tr>').join('');
  const sec = document.createElement('section'); sec.className='day'; sec.id='day-'+d.id;
  sec.innerHTML = '<h2>'+d.title+'</h2><p class="sub">'+d.sub+'</p><table><thead><tr><th></th><th>Time</th><th>Stop</th><th>What</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>'+(d.notes?'<p class="notes">'+d.notes+'</p>':'');
  sec.querySelectorAll('tbody tr').forEach(r=>r.addEventListener('click', ()=>{ showDetail(d.id, +r.dataset.i); document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'}); }));
  days.appendChild(sec);
});
show((location.hash||'#arr').slice(1));
</script>
</body>
