const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

const FRESH='<scr'+'ipt>(()=>{const C="8FKh2aw9IwDPdUTQpSc/P30tPv62Snqi";try{if((+sessionStorage.getItem("pages:fr")||0)>Date.now()-20000)return}catch(_){}fetch(location.pathname,{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{if(t&&t.indexOf(C)<0){try{sessionStorage.setItem("pages:fr",String(Date.now()))}catch(_){}location.replace(location.pathname+"?r="+Date.now())}}).catch(()=>{})})()</scr'+'ipt>';
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct));
  return new TextDecoder().decode(pt);
}

  try{ const html=await unlock(document.getElementById('pw').value);

       document.open(); document.write(html+FRESH); document.close(); }

});
